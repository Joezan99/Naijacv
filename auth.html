<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NaijaCV - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      color: #008751;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #008751;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #666;
    }

    .switch a {
      color: #008751;
      font-weight: bold;
      text-decoration: none;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.success {
      display: block;
      background: #e8f7ef;
      color: #08753f;
    }

    .status.error {
      display: block;
      background: #fdecec;
      color: #a00000;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      NaijaCV
    </div>

    <div class="card">

      <h1 id="formTitle">
        Login
      </h1>

      <div id="formSubtitle" class="subtitle">
        Log in to continue building your CV.
      </div>

      <div id="nameGroup" class="hidden">

        <label for="name">
          Full Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Your full name"
        >

      </div>

      <label for="email">
        Email Address
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="At least 6 characters"
        autocomplete="current-password"
      >

      <button
        id="submitButton"
        onclick="submitForm()"
      >
        Login
      </button>

      <div id="status" class="status"></div>

      <div class="switch">

        <span id="switchText">
          Don't have an account?
        </span>

        <a
          id="switchLink"
          href="auth.html?mode=signup"
        >
          Sign Up
        </a>

      </div>

      <div class="back">

        <a href="index.html">
          ← Back to NaijaCV
        </a>

      </div>

    </div>

  </div>


<script>

  /* =========================================
     SUPABASE CONFIGURATION
     ========================================= */

  const SUPABASE_URL =
    "https://wkkekfrfuuhsmifgddqr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_X0hCcFAvsC6rlepbtgxhig_hcXMtPyA";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     WEBSITE URLS
     ========================================= */

  const SITE_URL =
    "https://joezan99.github.io/Naijacv/";

  const BUILDER_URL =
    SITE_URL + "builder-v2.hfjxr


  /* =========================================
     CHECK LOGIN / SIGNUP MODE
     ========================================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const signupMode =
    params.get("mode") === "signup";


  /* =========================================
     SET UP PAGE
     ========================================= */

  function setupPage() {

    const formTitle =
      document.getElementById("formTitle");

    const formSubtitle =
      document.getElementById("formSubtitle");

    const nameGroup =
      document.getElementById("nameGroup");

    const submitButton =
      document.getElementById("submitButton");

    const switchText =
      document.getElementById("switchText");

    const switchLink =
      document.getElementById("switchLink");


    if (signupMode) {

      formTitle.textContent =
        "Create Account";

      formSubtitle.textContent =
        "Create your NaijaCV account and start building your CV.";

      nameGroup.classList.remove("hidden");

      submitButton.textContent =
        "Create Account";

      switchText.textContent =
        "Already have an account?";

      switchLink.textContent =
        "Login";

      switchLink.href =
        "auth.html?mode=login";
    }
  }


  /* =========================================
     STATUS MESSAGE
     ========================================= */

  function showStatus(message, type) {

    const status =
      document.getElementById("status");

    status.textContent =
      message;

    status.className =
      "status " + type;
  }


  /* =========================================
     SUBMIT LOGIN / SIGNUP
     ========================================= */

  async function submitForm() {

    const name =
      document.getElementById("name")
      .value
      .trim();

    const email =
      document.getElementById("email")
      .value
      .trim();

    const password =
      document.getElementById("password")
      .value;

    const button =
      document.getElementById("submitButton");


    showStatus("", "");


    /* Basic validation */

    if (!email || !password) {

      showStatus(
        "Please enter your email and password.",
        "error"
      );

      return;
    }


    if (signupMode && !name) {

      showStatus(
        "Please enter your full name.",
        "error"
      );

      return;
    }


    if (signupMode && password.length < 6) {

      showStatus(
        "Your password must be at least 6 characters.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      signupMode
        ? "Creating Account..."
        : "Logging In...";


    try {


      /* =====================================
         SIGN UP
         ===================================== */

      if (signupMode) {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name
              }

            }

          });


        if (error) {
          throw error;
        }


        /* Check that Supabase created a user */

        if (!data || !data.user) {

          throw new Error(
            "Account could not be created. Please try again."
          );

        }


        /* =================================
           CREATE PROFILE
           ================================= */

        const {
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .upsert({

              id: data.user.id,

              full_name: name

            });


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );

        }


        /* =================================
           GO DIRECTLY TO CV BUILDER
           ================================= */

        window.location.href =
          BUILDER_URL;

        return;
      }


      /* =====================================
         LOGIN
         ===================================== */

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {
        throw error;
      }


      if (!data || !data.user) {

        throw new Error(
          "Login failed. Please try again."
        );

      }


      /* =================================
         MAKE SURE PROFILE EXISTS
         ================================= */

      const {
        error: profileError
      } =
        await supabaseClient
          .from("profiles")
          .upsert({

            id: data.user.id

          });


      if (profileError) {

        console.error(
          "Profile error:",
          profileError
        );

      }


      /* =================================
         GO TO CV BUILDER
         ================================= */

      window.location.href =
        BUILDER_URL;


    } catch (error) {

      console.error(error);

      showStatus(

        error.message ||
        "Something went wrong. Please try again.",

        "error"

      );


      button.disabled = false;

      button.textContent =
        signupMode
          ? "Create Account"
          : "Login";
    }

  }


  /* =========================================
     START PAGE
     ========================================= */

  setupPage();

</script>

</body>
</html>
