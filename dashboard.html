<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NaijaCV - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #166534;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-email {
      font-size: 14px;
      color: #64748b;
    }

    .logout-btn {
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #64748b;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 15px;
    }

    .top-actions h2 {
      font-size: 22px;
    }

    .create-btn {
      border: none;
      background: #166534;
      color: white;
      padding: 12px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .create-btn:hover {
      background: #14532d;
    }

    .cv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
    }

    .cv-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }

    .cv-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: #dcfce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 15px;
    }

    .cv-card h3 {
      font-size: 19px;
      margin-bottom: 7px;
    }

    .cv-card p {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .cv-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-btn {
      border: none;
      padding: 9px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .edit-btn {
      background: #dcfce7;
      color: #166534;
    }

    .duplicate-btn {
      background: #e0f2fe;
      color: #0369a1;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty {
      background: white;
      border: 2px dashed #d1d5db;
      border-radius: 14px;
      padding: 50px 20px;
      text-align: center;
      color: #64748b;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #64748b;
    }

    .message {
      margin-bottom: 20px;
      padding: 12px 15px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    @media (max-width: 600px) {

      header {
        padding: 14px 4%;
      }

      .user-email {
        display: none;
      }

      .container {
        width: 92%;
        margin: 28px auto;
      }

      .welcome h1 {
        font-size: 27px;
      }

      .top-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .create-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    NaijaCV
  </div>

  <div class="user-area">

    <span id="userEmail" class="user-email">
      Loading...
    </span>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>

</header>


<main class="container">

  <section class="welcome">

    <h1>
      Welcome back 👋
    </h1>

    <p>
      Manage your CVs and create professional resumes for your career.
    </p>

  </section>


  <div id="message" class="message"></div>


  <section>

    <div class="top-actions">

      <h2>
        My CVs
      </h2>

      <button class="create-btn" onclick="createNewCV()">
        + Create New CV
      </button>

    </div>


    <div id="cvContainer">

      <div class="loading">
        Loading your CVs...
      </div>

    </div>

  </section>

</main>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL = "https://wkkekfrfuuhsmifgddqr.supabase.co";

  const SUPABASE_KEY =     "sb_publishable_X0hCcFAvsC6rlepbtgxhig_hcXMtPyA";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     CHECK LOGIN
  ================================= */

  let currentUser = null;


  async function checkUser() {

    const {
      data,
      error
    } = await supabaseClient.auth.getUser();


    if (error || !data.user) {

      window.location.href =
        "auth.html?mode=login";

      return;

    }


    currentUser = data.user;


    document.getElementById("userEmail").textContent =
      currentUser.email;


    loadCVs();

  }


  /* ================================
     LOAD CVs
  ================================= */

  async function loadCVs() {

    const container =
      document.getElementById("cvContainer");


    const {
      data,
      error
    } = await supabaseClient
      .from("cvs")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("updated_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <h3>Unable to load your CVs</h3>
          <p>Please refresh the page and try again.</p>
        </div>
      `;

      return;

    }


    if (!data || data.length === 0) {

      container.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            📄
          </div>

          <h3>
            You don't have a CV yet
          </h3>

          <p style="margin:10px 0 20px;">
            Create your first professional CV.
          </p>

          <button
            class="create-btn"
            onclick="createNewCV()">
            Create My First CV
          </button>

        </div>
      `;

      return;

    }


    container.innerHTML = "";


    data.forEach(cv => {

      const card =
        document.createElement("div");

      card.className = "cv-card";


      const title =
        cv.title || "My CV";


      const career =
        cv.career_type || "General CV";


      const updated =
        cv.updated_at
          ? new Date(cv.updated_at)
              .toLocaleDateString()
          : "Recently";


      card.innerHTML = `

        <div class="cv-icon">
          📄
        </div>

        <h3>
          ${escapeHTML(title)}
        </h3>

        <p>
          ${escapeHTML(career)}
          <br>
          Updated ${updated}
        </p>

        <div class="cv-actions">

          <button
            class="action-btn edit-btn"
            onclick="editCV('${cv.id}')">
            Edit
          </button>

          <button
            class="action-btn duplicate-btn"
            onclick="duplicateCV('${cv.id}')">
            Duplicate
          </button>

          <button
            class="action-btn delete-btn"
            onclick="deleteCV('${cv.id}')">
            Delete
          </button>

        </div>

      `;


      container.appendChild(card);

    });

  }


  /* ================================
     CREATE NEW CV
  ================================= */

  function createNewCV() {

    window.location.href =
      "builder-v2.html?new=true";

  }


  /* ================================
     EDIT CV
  ================================= */

  function editCV(cvId) {

    window.location.href =
      "builder-v2.html?id=" +
      encodeURIComponent(cvId);

  }


  /* ================================
     DUPLICATE CV
  ================================= */

  async function duplicateCV(cvId) {

    const {
      data: original,
      error: findError
    } = await supabaseClient
      .from("cvs")
      .select("*")
      .eq("id", cvId)
      .eq("user_id", currentUser.id)
      .single();


    if (findError || !original) {

      showMessage(
        "Unable to find this CV.",
        "error"
      );

      return;

    }


    const newCV = {
      ...original
    };


    delete newCV.id;


    newCV.title =
      (original.title || "My CV") +
      " Copy";


    newCV.created_at =
      new Date().toISOString();


    newCV.updated_at =
      new Date().toISOString();


    const {
      data: duplicated,
      error: duplicateError
    } = await supabaseClient
      .from("cvs")
      .insert(newCV)
      .select()
      .single();


    if (duplicateError) {

      console.error(duplicateError);

      showMessage(
        "Unable to duplicate this CV.",
        "error"
      );

      return;

    }


    /*
      Copy child data
    */

    await duplicateChildData(
      cvId,
      duplicated.id
    );


    showMessage(
      "CV duplicated successfully!",
      "success"
    );


    loadCVs();

  }


  /* ================================
     DUPLICATE CHILD DATA
  ================================= */

  async function duplicateChildData(
    oldCVId,
    newCVId
  ) {

    const tables = [
      "education",
      "experience",
      "skills"
    ];


    for (const table of tables) {

      const {
        data,
        error
      } = await supabaseClient
        .from(table)
        .select("*")
        .eq("cv_id", oldCVId);


      if (error || !data) {
        continue;
      }


      if (data.length === 0) {
        continue;
      }


      const copiedRows =
        data.map(row => {

          const newRow = {
            ...row
          };

          delete newRow.id;

          newRow.cv_id =
            newCVId;

          return newRow;

        });


      await supabaseClient
        .from(table)
        .insert(copiedRows);

    }

  }


  /* ================================
     DELETE CV
  ================================= */

  async function deleteCV(cvId) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this CV? This cannot be undone."
      );


    if (!confirmed) {
      return;
    }


    /*
      Delete child records first
    */

    const tables = [
      "education",
      "experience",
      "skills"
    ];


    for (const table of tables) {

      await supabaseClient
        .from(table)
        .delete()
        .eq("cv_id", cvId);

    }


    const {
      error
    } = await supabaseClient
      .from("cvs")
      .delete()
      .eq("id", cvId)
      .eq("user_id", currentUser.id);


    if (error) {

      console.error(error);

      showMessage(
        "Unable to delete CV.",
        "error"
      );

      return;

    }


    showMessage(
      "CV deleted successfully.",
      "success"
    );


    loadCVs();

  }


  /* ================================
     LOGOUT
  ================================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "auth.html?mode=login";

  }


  /* ================================
     MESSAGE
  ================================= */

  function showMessage(
    message,
    type
  ) {

    const box =
      document.getElementById("message");


    box.textContent = message;

    box.className =
      "message " + type;

    box.style.display = "block";


    setTimeout(() => {

      box.style.display = "none";

    }, 3000);

  }


  /* ================================
     SECURITY HELPER
  ================================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ================================
     START
  ================================= */

  checkUser();

</script>

</body>
</html>
