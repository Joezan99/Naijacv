<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaijaCV - CV Preview</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#eeeeee;
  color:#111;
}

button{
  font-family:inherit;
}

.topbar{
  width:100%;
  min-height:64px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#d4af37;
}

.top-actions{
  display:flex;
  gap:8px;
}

.top-btn{
  border:1px solid #d4af37;
  background:transparent;
  color:#fff;
  padding:9px 14px;
  border-radius:5px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.top-btn.primary{
  background:#d4af37;
  color:#111;
}

.loading,
.error{
  max-width:700px;
  margin:30px auto;
  padding:18px;
  border-radius:8px;
  text-align:center;
}

.loading{
  background:#fff;
}

.error{
  display:none;
  background:#ffe7e7;
  color:#a00000;
  border:1px solid #e4aaaa;
}

.page-wrap{
  padding:25px;
  display:flex;
  justify-content:center;
}

.cv-page{
  width:210mm;
  height:297mm;
  max-width:210mm;
  max-height:297mm;
  background:#fff;
  overflow:hidden;
  position:relative;
  box-shadow:0 4px 25px rgba(0,0,0,.2);
  color:#111;
}

/* =========================
   FOOTBALL CV
========================= */

.football-cv{
  background:#0c0c0c;
  color:#fff;
  height:100%;
  display:flex;
  flex-direction:column;
}

.gold{
  color:#d4af37;
}

.fp-header{
  height:31%;
  min-height:31%;
  display:grid;
  grid-template-columns:38% 62%;
  position:relative;
  background:#101010;
  border-bottom:4px solid #d4af37;
}

.fp-photo{
  height:100%;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.fp-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
}

.fp-head-info{
  padding:25px 28px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
}

.fp-small-label{
  color:#d4af37;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:900;
  margin-bottom:5px;
}

.fp-name{
  font-size:39px;
  line-height:.95;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:-2px;
  word-break:break-word;
}

.fp-position{
  display:inline-block;
  margin-top:12px;
  background:#d4af37;
  color:#111;
  padding:7px 13px;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  width:max-content;
}

.fp-club{
  margin-top:10px;
  font-size:12px;
  color:#bbb;
  font-weight:700;
}

.fp-body{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:35% 65%;
}

.fp-left{
  background:#151515;
  padding:14px;
  overflow:hidden;
}

.fp-right{
  background:#f7f7f7;
  color:#111;
  padding:17px 20px;
  overflow:hidden;
}

.section{
  margin-bottom:12px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:7px;
  color:#d4af37;
  font-size:9px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  font-weight:900;
  margin-bottom:6px;
}

.section-title:after{
  content:"";
  height:1px;
  flex:1;
  background:rgba(212,175,55,.35);
}

.fp-right .section-title{
  color:#111;
}

.fp-right .section-title:after{
  background:#d4af37;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.info-card{
  background:#202020;
  padding:7px;
  min-height:43px;
}

.info-label{
  font-size:7px;
  color:#888;
  text-transform:uppercase;
  letter-spacing:.6px;
  font-weight:800;
}

.info-value{
  margin-top:2px;
  font-size:9px;
  font-weight:800;
  word-break:break-word;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.stat{
  background:#d4af37;
  color:#111;
  padding:8px 4px;
  text-align:center;
}

.stat-number{
  font-size:17px;
  font-weight:1000;
}

.stat-label{
  font-size:6px;
  font-weight:900;
  text-transform:uppercase;
}

.dark-card{
  background:#202020;
  padding:8px;
  font-size:8px;
  line-height:1.4;
  color:#ddd;
}

.contact-line{
  font-size:8px;
  line-height:1.45;
  margin-bottom:4px;
  word-break:break-word;
}

.contact-line strong{
  color:#d4af37;
}

.profile-text{
  font-size:8.5px;
  line-height:1.42;
  color:#333;
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.right-card{
  background:#fff;
  border-left:3px solid #d4af37;
  padding:7px 8px;
  margin-bottom:6px;
  font-size:8px;
  line-height:1.35;
}

.right-card strong{
  font-size:8.5px;
}

.pill-list{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

.pill{
  background:#111;
  color:#fff;
  padding:4px 6px;
  font-size:7px;
  font-weight:700;
}

.light-pill{
  background:#e8e8e8;
  color:#111;
}

.bullet-list{
  padding-left:12px;
}

.bullet-list li{
  font-size:8px;
  line-height:1.35;
  margin-bottom:3px;
}

.fp-footer{
  height:24px;
  min-height:24px;
  background:#d4af37;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  font-size:7px;
  font-weight:900;
  text-transform:uppercase;
}

/* =========================
   NORMAL CV
========================= */

.normal-cv{
  height:100%;
  background:#fff;
  color:#111;
  padding:35px;
}

.normal-header{
  border-bottom:3px solid #111;
  padding-bottom:15px;
  margin-bottom:18px;
}

.normal-name{
  font-size:30px;
  font-weight:900;
  text-transform:uppercase;
}

.normal-title{
  margin-top:4px;
  font-size:14px;
  color:#555;
}

.normal-contact{
  margin-top:8px;
  font-size:9px;
  color:#555;
}

.normal-section{
  margin-bottom:17px;
}

.normal-section h2{
  font-size:12px;
  text-transform:uppercase;
  border-bottom:1px solid #ccc;
  padding-bottom:4px;
  margin-bottom:7px;
}

.normal-section p,
.normal-section li{
  font-size:9px;
  line-height:1.45;
}

.normal-section ul{
  padding-left:15px;
}

.hidden-section{
  display:none !important;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){
  .topbar{
    padding:9px 12px;
  }

  .logo{
    font-size:18px;
  }

  .top-btn{
    padding:8px 9px;
    font-size:11px;
  }

  .page-wrap{
    padding:10px 0;
    overflow:auto;
    justify-content:flex-start;
  }

  .cv-page{
    transform-origin:top left;
    flex-shrink:0;
  }
}

/* =========================
   PRINT
========================= */

@media print{
  @page{
    size:A4;
    margin:0;
  }

  html,
  body{
    width:210mm;
    height:297mm;
    margin:0;
    padding:0;
    background:#fff;
  }

  .topbar,
  .loading,
  .error{
    display:none !important;
  }

  .page-wrap{
    padding:0 !important;
    margin:0 !important;
    display:block !important;
  }

  .cv-page{
    width:210mm !important;
    height:297mm !important;
    max-width:210mm !important;
    max-height:297mm !important;
    box-shadow:none !important;
    margin:0 !important;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">Naija<span>CV</span></div>

  <div class="top-actions">
    <button class="top-btn" onclick="goBack()">← Back</button>
    <button class="top-btn primary" onclick="printCV()">Print / PDF</button>
  </div>
</header>

<div id="loading" class="loading">
  Loading CV...
</div>

<div id="error" class="error"></div>

<div id="previewContainer" class="page-wrap" style="display:none;">
