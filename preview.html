/* =========================
   BASIC HELPERS
========================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function getCVId(){

  const params =
    new URLSearchParams(window.location.search);

  return params.get("id");
}


function text(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value).trim();
}


function display(value, fallback = "—"){

  const clean = text(value);

  return clean || fallback;
}


function setText(id,value,fallback = "—"){

  const el = document.getElementById(id);

  if(!el){
    return;
  }

  el.textContent = display(value,fallback);
}


function show(id){

  const el = document.getElementById(id);

  if(el){
    el.classList.remove("hidden-section");
  }
}


function hide(id){

  const el = document.getElementById(id);

  if(el){
    el.classList.add("hidden-section");
  }
}


function hasValue(value){

  return text(value).length > 0;
}


/* =========================
   SECTION VISIBILITY
========================= */

function sectionVisibility(
  sectionId,
  values
){

  const hasContent =
    values.some(value => hasValue(value));

  if(hasContent){
    show(sectionId);
  }else{
    hide(sectionId);
  }

  return hasContent;
}


/* =========================
   PHOTO
========================= */

function getPhotoUrl(photoPath){

  if(!photoPath){
    return "";
  }

  /*
    If the saved value is already a complete URL,
    use it directly.
  */

  if(
    photoPath.startsWith("http://") ||
    photoPath.startsWith("https://")
  ){

    return photoPath;
  }

  const result =
    supabaseClient
      .storage
      .from("cv-photos")
      .getPublicUrl(photoPath);

  return result.data?.publicUrl || "";
}


/* =========================
   FOOTBALL RENDER
========================= */

function renderFootball(cv){

  document.getElementById("footballCV").style.display =
    "flex";

  document.getElementById("normalCV").style.display =
    "none";


  const data =
    cv.career_data || {};


  /* HEADER */

  setText(
    "previewName",
    cv.full_name || data.fullName,
    "PLAYER NAME"
  );

  setText(
    "previewPosition",
    data.position,
    "FOOTBALL PLAYER"
  );

  setText(
    "previewClub",
    data.club,
    ""
  );


  /* PHOTO */

  const photo =
    getPhotoUrl(data.photoPath);

  const photoEl =
    document.getElementById("previewPhoto");

  const placeholder =
    document.getElementById("photoPlaceholder");


  if(photo){

    photoEl.src = photo;
    photoEl.style.display = "block";

    placeholder.style.display = "none";

    photoEl.onerror = function(){

      photoEl.style.display = "none";
      placeholder.style.display = "flex";

    };

  }else{

    photoEl.style.display = "none";
    placeholder.style.display = "flex";

  }


  /* PLAYER INFO */

  setText("infoDob",data.dob);
  setText("infoNationality",data.nationality);
  setText("infoHeight",data.height);
  setText("infoFoot",data.foot);
  setText("infoPosition",data.position);
  setText("infoSecondary",data.secondaryPosition);
  setText("infoClub",data.club);
  setText(
    "infoLocation",
    cv.location || data.location
  );


  /* CONTACT */

  setText(
    "contactEmail",
    cv.email
  );

  setText(
    "contactPhone",
    cv.phone
  );

  setText(
    "contactLocation",
    cv.location || data.location
  );


  /* STATS */

  setText(
    "statMatches",
    data.matches || "0",
    "0"
  );

  setText(
    "statGoals",
    data.goals || "0",
    "0"
  );

  setText(
    "statAssists",
    data.assists || "0",
    "0"
  );


  /* STRENGTHS */

  const strengths =
    document.getElementById("previewStrengths");

  strengths.textContent =
    display(data.strengths);


  sectionVisibility(
    "strengthSection",
    [data.strengths]
  );


  /* QUALITIES */

  const qualities =
    document.getElementById("previewQualities");

  qualities.textContent =
    display(data.qualities);


  sectionVisibility(
    "qualitiesSection",
    [data.qualities]
  );


  /* PROFILE */

  const profile =
    cv.summary || data.summary || "";

  setText(
    "previewProfile",
    profile
  );

  sectionVisibility(
    "profileSection",
    [profile]
  );


  /* PLAYING STYLE */

  setText(
    "previewPlayingStyle",
    data.playingStyle
  );

  sectionVisibility(
    "playingStyleSection",
    [data.playingStyle]
  );


  /* ATTRIBUTES */

  setText(
    "previewTechnical",
    data.technical
  );

  setText(
    "previewTactical",
    data.tactical
  );

  setText(
    "previewPhysical",
    data.physical
  );

  setText(
    "previewMental",
    data.mental
  );


  const attributesExist =
    [
      data.technical,
      data.tactical,
      data.physical,
      data.mental
    ].some(hasValue);


  if(attributesExist){

    show("attributesSection");

  }else{

    hide("attributesSection");

  }


  /* TRAINING */

  setText(
    "previewPersonalTraining",
    data.personalTraining
  );

  setText(
    "previewTeamTraining",
    data.teamTraining
  );

  setText(
    "previewTrainingFocus",
    data.trainingFocus
  );

  setText(
    "previewFootballEducation",
    data.footballEducation
  );


  sectionVisibility(
    "trainingSection",
    [
      data.personalTraining,
      data.teamTraining,
      data.trainingFocus,
      data.footballEducation
    ]
  );


  /* CAREER */

  const previousClubs =
    data.previousClubs || "";

  const competitions =
    data.competitions || "";


  document.querySelector(
    "#previewPreviousClubs span"
  ).textContent =
    display(previousClubs);


  document.querySelector(
    "#previewCompetitions span"
  ).textContent =
    display(competitions);


  sectionVisibility(
    "careerSection",
    [
      previousClubs,
      competitions
    ]
  );


  /* ACHIEVEMENTS */

  setText(
    "previewAchievements",
    data.achievements
  );


  sectionVisibility(
    "achievementsSection",
    [data.achievements]
  );


  /* CAREER OBJECTIVE */

  setText(
    "previewObjective",
    data.careerObjective
  );


  sectionVisibility(
    "objectiveSection",
    [data.careerObjective]
  );


  /* RECRUITMENT */

  setText(
    "previewTrials",
    data.trials
  );

  setText(
    "previewAvailability",
    data.availability
  );

  setText(
    "previewTrialLocation",
    data.preferredTrialLocation
  );


  /*
    Video is displayed as a safe clickable URL.
  */

  const videoEl =
    document.getElementById("previewVideo");

  videoEl.innerHTML = "—";


  if(hasValue(data.video)){

    let url =
      text(data.video);

    if(
      !url.startsWith("http://") &&
      !url.startsWith("https://")
    ){

      url = "https://" + url;

    }

    try{

      const parsed =
        new URL(url);

      if(
        parsed.protocol === "http:" ||
        parsed.protocol === "https:"
      ){

        const link =
          document.createElement("a");

        link.href = parsed.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Watch Highlight Video";

        link.style.color = "#111";
        link.style.fontWeight = "800";
        link.style.textDecoration = "underline";

        videoEl.appendChild(link);

      }

    }catch(error){

      videoEl.textContent = "—";

    }

  }


  const recruitmentExists =
    [
      data.trials,
      data.availability,
      data.preferredTrialLocation,
      data.video
    ].some(hasValue);


  if(recruitmentExists){

    show("recruitmentSection");

  }else{

    hide("recruitmentSection");

  }


  /* LANGUAGES */

  const languageContainer =
    document.getElementById("previewLanguages");

  languageContainer.innerHTML = "";


  if(hasValue(data.languages)){

    const languages =
      data.languages
        .split(/[,;\n]+/)
        .map(item => item.trim())
        .filter(Boolean);


    languages.forEach(language => {

      const pill =
        document.createElement("span");

      pill.className = "pill";

      pill.textContent = language;

      languageContainer.appendChild(pill);

    });


    show("languagesSection");

  }else{

    hide("languagesSection");

  }


  /* MATCH HIGHLIGHTS */

  setText(
    "previewMatchHighlights",
    data.recentMatchHighlights
  );


  sectionVisibility(
    "additionalSection",
    [data.recentMatchHighlights]
  );


  /* FOOTBALL LINKS */

  const linksEl =
    document.getElementById("previewFootballLinks");

  linksEl.textContent =
    display(data.footballLinks);


  /* REFERENCES */

  const referencesEl =
    document.getElementById("previewReferences");

  referencesEl.textContent =
    display(data.references);


  sectionVisibility(
    "linksSection",
    [
      data.footballLinks,
      data.references
    ]
  );

}

/* =========================
   LOAD CHILD DATA
========================= */

async function loadChildData(cvId){

  const result = {
    education:[],
    experience:[],
    skills:[]
  };


  const tables = [
    "education",
    "experience",
    "skills"
  ];


  for(const table of tables){

    try{

      const { data, error } =
        await supabaseClient
          .from(table)
          .select("*")
          .eq("cv_id",cvId);


      if(!error && Array.isArray(data)){

        result[table] = data;

      }

    }catch(error){

      console.warn(
        "Could not load",
        table,
        error
      );

    }

  }


  return result;
}


/* =========================
   LOAD CV
========================= */

async function loadCV(){

  try{

    const cvId =
      getCVId();


    if(!cvId){

      throw new Error(
        "No CV ID was provided."
      );

    }


    const {
      data:{
        user
      },
      error:authError
    } =
      await supabaseClient.auth.getUser();


    if(authError || !user){

      throw new Error(
        "Please log in to view this CV."
      );

    }


    currentUser = user;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("cvs")
        .select("*")
        .eq("id",cvId)
        .eq("user_id",user.id)
        .single();


    if(error){

      throw error;

    }


    if(!data){

      throw new Error(
        "CV not found."
      );

    }


    currentCV = data;


    /*
      Load child tables for normal CVs.
    */

    const children =
      await loadChildData(cvId);


    currentCV.education =
      children.education;

    currentCV.experience =
      children.experience;

    currentCV.skills =
      children.skills;


    const career =
      String(
        data.career_type || "general"
      ).toLowerCase();


    if(career === "football"){

      renderFootball(data);

    }else{

      renderNormal(currentCV);

    }


    document.getElementById(
      "loading"
    ).style.display = "none";


    document.getElementById(
      "error"
    ).style.display = "none";


    document.getElementById(
      "previewContainer"
    ).style.display = "flex";


  }catch(error){

    console.error(error);


    document.getElementById(
      "loading"
    ).style.display = "none";


    const errorBox =
      document.getElementById("error");


    errorBox.style.display = "block";


    errorBox.textContent =
      error.message ||
      "Unable to load this CV.";

  }

}
