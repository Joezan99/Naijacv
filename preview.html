<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CV Preview - NaijaCV</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef1f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    /* TOP BAR */
    .topbar {
      background: #111827;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .back-btn {
      background: white;
      color: #111827;
    }

    .download-btn {
      background: #16a34a;
      color: white;
    }

    /* LOADING */
    #loading {
      text-align: center;
      padding: 50px 20px;
      font-size: 18px;
    }

    #error {
      display: none;
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      color: #b91c1c;
      text-align: center;
    }

    /* CV PAGE */
    .cv-container {
      width: 210mm;
      min-height: 297mm;
      margin: 30px auto;
      background: white;
      padding: 22mm 20mm;
      box-shadow: 0 3px 20px rgba(0,0,0,0.12);
    }

    /* HEADER */
    .cv-header {
      border-bottom: 2px solid #111827;
      padding-bottom: 15px;
      margin-bottom: 22px;
    }

    .name {
      font-size: 32px;
      font-weight: bold;
      margin: 0 0 5px;
      color: #111827;
    }

    .job-title {
      font-size: 17px;
      color: #555;
      margin-bottom: 12px;
    }

    .contact {
      font-size: 13px;
      color: #555;
      line-height: 1.7;
    }

    /* SECTIONS */
    .section {
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      color: #111827;
      border-bottom: 1px solid #d1d5db;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .section-content {
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }

    /* SKILLS */
    .skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .skill {
      background: #f1f5f9;
      border: 1px solid #d1d5db;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 13px;
    }

    .empty {
      color: #888;
      font-style: italic;
    }

    /* MOBILE */
    @media (max-width: 800px) {
      .topbar {
        position: relative;
      }

      .cv-container {
        width: calc(100% - 20px);
        min-height: auto;
        margin: 10px auto;
        padding: 25px 18px;
      }

      .name {
        font-size: 27px;
      }
    }

    /* PRINT */
    @media print {
      body {
        background: white;
      }

      .topbar {
        display: none;
      }

      .cv-container {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        box-shadow: none;
        padding: 20mm;
      }
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">NaijaCV</div>

    <div class="actions">
      <button class="back-btn" onclick="goBack()">
        ← Back
      </button>

      <button class="download-btn" onclick="window.print()">
        📥 Download / Print
      </button>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loading">
    Loading your CV...
  </div>

  <!-- ERROR -->
  <div id="error"></div>

  <!-- CV -->
  <main id="cvContainer" class="cv-container" style="display:none;">

    <!-- HEADER -->
    <div class="cv-header">

      <h1 id="fullName" class="name">
        Your Name
      </h1>

      <div id="professionalTitle" class="job-title">
        Professional Title
      </div>

      <div id="contact" class="contact"></div>

    </div>


    <!-- SUMMARY -->
    <section class="section">

      <div class="section-title">
        Professional Summary
      </div>

      <div id="summary" class="section-content"></div>

    </section>


    <!-- EDUCATION -->
    <section class="section">

      <div class="section-title">
        Education
      </div>

      <div id="education" class="section-content"></div>

    </section>


    <!-- EXPERIENCE -->
    <section class="section">

      <div class="section-title">
        Experience
      </div>

      <div id="experience" class="section-content"></div>

    </section>


    <!-- SKILLS -->
    <section class="section">

      <div class="section-title">
        Skills
      </div>

      <div id="skills" class="skills-container"></div>

    </section>

  </main>


  <script>

    /* ==========================================
       SUPABASE
       ========================================== */

    const SUPABASE_URL =
      "https://wkkekfrfuuhsmifgddqr.supabase.co";

    /*
      IMPORTANT:
      Replace this with the SAME publishable key
      you are already using in your working
      dashboard.html / builder-v2.html.
      
      DO NOT use your Supabase secret/service-role key.
    */

    const SUPABASE_KEY =
      "sb_publishable_X0hCcFAvsC6rlepbtgxhig_hcXMtPyA";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==========================================
       HELPERS
       ========================================== */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function showError(message) {

      document.getElementById("loading").style.display = "none";

      const errorBox =
        document.getElementById("error");

      errorBox.style.display = "block";

      errorBox.innerHTML =
        escapeHTML(message);
    }


    function goBack() {

      window.location.href =
        "dashboard.html";
    }


    /* ==========================================
       GET CV ID FROM URL
       ========================================== */

    function getCVId() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      return params.get("id");
    }


    /* ==========================================
       LOAD CV
       ========================================== */

    async function loadCV() {

      try {

        /* Check logged-in user */

        const {
          data: { user },
          error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !user) {

          window.location.href =
            "auth.html?mode=login";

          return;
        }


        /* Get CV ID */

        const cvId = getCVId();


        if (!cvId) {

          showError(
            "No CV was selected."
          );

          return;
        }


        /* Get CV */

        const {
          data: cv,
          error: cvError
        } = await supabaseClient
          .from("cvs")
          .select("*")
          .eq("id", cvId)
          .eq("user_id", user.id)
          .single();


        if (cvError) {

          console.error(cvError);

          showError(
            "We could not load this CV."
          );

          return;
        }


        if (!cv) {

          showError(
            "CV not found."
          );

          return;
        }


        /* ======================================
           BASIC INFORMATION
           ====================================== */

        document.getElementById("fullName")
          .textContent =
          cv.full_name || "Your Name";


        document.getElementById("professionalTitle")
          .textContent =
          cv.professional_title ||
          "Professional";


        /* ======================================
           CONTACT
           ====================================== */

        let contact = [];

        if (cv.email) {
          contact.push(
            escapeHTML(cv.email)
          );
        }

        if (cv.phone) {
          contact.push(
            escapeHTML(cv.phone)
          );
        }

        if (cv.location) {
          contact.push(
            escapeHTML(cv.location)
          );
        }


        document.getElementById("contact")
          .innerHTML =
          contact.length
            ? contact.join(" • ")
            : "";


        /* ======================================
           SUMMARY
           ====================================== */

        document.getElementById("summary")
          .innerHTML =
          cv.summary
            ? escapeHTML(cv.summary)
            : '<span class="empty">No summary added.</span>';


        /* ======================================
           EDUCATION
           ====================================== */

        const {
          data: education,
          error: educationError
        } = await supabaseClient
          .from("education")
          .select("*")
          .eq("cv_id", cvId);


        if (educationError) {

          console.error(
            "Education error:",
            educationError
          );

        }


        let educationHTML = "";


        if (
          education &&
          education.length > 0
        ) {

          educationHTML =
            education
              .map(item => {

                return `
                  <div style="margin-bottom:12px;">
                    <strong>
                      ${escapeHTML(
                        item.school ||
                        item.institution ||
                        ""
                      )}
                    </strong>

                    <br>

                    ${escapeHTML(
                      item.degree ||
                      item.course ||
                      ""
                    )}

                    ${
                      item.start_date ||
                      item.end_date
                        ? `<br>
                           ${escapeHTML(
                             item.start_date || ""
                           )}
                           ${
                             item.end_date
                               ? " - " +
                                 escapeHTML(
                                   item.end_date
                                 )
                               : ""
                           }`
                        : ""
                    }
                  </div>
                `;

              })
              .join("");

        } else {

          educationHTML =
            '<span class="empty">No education added.</span>';

        }


        document.getElementById("education")
          .innerHTML =
          educationHTML;


        /* ======================================
           EXPERIENCE
           ====================================== */

        const {
          data: experience,
          error: experienceError
        } = await supabaseClient
          .from("experience")
          .select("*")
          .eq("cv_id", cvId);


        if (experienceError) {

          console.error(
            "Experience error:",
            experienceError
          );

        }


        let experienceHTML = "";


        if (
          experience &&
          experience.length > 0
        ) {

          experienceHTML =
            experience
              .map(item => {

                return `
                  <div style="margin-bottom:15px;">

                    <strong>
                      ${escapeHTML(
                        item.job_title ||
                        item.position ||
                        ""
                      )}
                    </strong>

                    ${
                      item.company
                        ? `<br>
                           <strong>
                             ${escapeHTML(
                               item.company
                             )}
                           </strong>`
                        : ""
                    }

                    ${
                      item.start_date ||
                      item.end_date
                        ? `<div>
                           ${escapeHTML(
                             item.start_date || ""
                           )}
                           ${
                             item.end_date
                               ? " - " +
                                 escapeHTML(
                                   item.end_date
                                 )
                               : ""
                           }
                           </div>`
                        : ""
                    }

                    ${
                      item.description
                        ? `<div style="margin-top:5px;">
                           ${escapeHTML(
                             item.description
                           )}
                           </div>`
                        : ""
                    }

                  </div>
                `;

              })
              .join("");

        } else {

          experienceHTML =
            '<span class="empty">No work experience added.</span>';

        }


        document.getElementById("experience")
          .innerHTML =
          experienceHTML;


        /* ======================================
           SKILLS
           ====================================== */

        const {
          data: skills,
          error: skillsError
        } = await supabaseClient
          .from("skills")
          .select("*")
          .eq("cv_id", cvId);


        if (skillsError) {

          console.error(
            "Skills error:",
            skillsError
          );

        }


        let skillsHTML = "";


        if (
          skills &&
          skills.length > 0
        ) {

          skillsHTML =
            skills
              .map(item => {

                const skill =
                  item.skill ||
                  item.name ||
                  item.skill_name ||
                  "";

                return `
                  <span class="skill">
                    ${escapeHTML(skill)}
                  </span>
                `;

              })
              .join("");

        } else {

          skillsHTML =
            '<span class="empty">No skills added.</span>';

        }


        document.getElementById("skills")
          .innerHTML =
          skillsHTML;


        /* ======================================
           SHOW CV
           ====================================== */

        document.getElementById("loading")
          .style.display = "none";

        document.getElementById("cvContainer")
          .style.display = "block";


      } catch (error) {

        console.error(error);

        showError(
          "Something went wrong while loading your CV."
        );

      }

    }


    /* ==========================================
       START
       ========================================== */

    loadCV();

  </script>

</body>
</html>
